[project]
name = "com-lyricsisland"
version = "1.0.0"
description = "LyricsIsland widget for Class Widgets 2: receives live lyrics via local HTTP and displays them."
authors = [
    {name = "松峰"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["class-widgets-sdk>=0.6.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
